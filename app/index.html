<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AION2 非公式Wiki</title>
    <meta
      name="description"
      content="AION2（グローバル版）の非公式Wiki。システム・ダンジョン・経済・クラスの攻略情報を出典付きで掲載。"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AION2 非公式Wiki" />
    <meta property="og:title" content="AION2 非公式Wiki" />
    <meta
      property="og:description"
      content="AION2（グローバル版）の非公式Wiki。システム・ダンジョン・経済・クラスの攻略情報を出典付きで掲載。"
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
    />
    <script>
      // 初回描画前にテーマを適用してちらつきを防ぐ
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('aion2wiki:theme') || 'system';
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <noscript>このサイトの表示には JavaScript が必要です。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
